name: .NET

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpenAP.NET.sln

      - name: Build
        run: dotnet build OpenAP.NET.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenAP.NET.sln --configuration Release --no-build
